name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint
      # Formatação (Prettier) em todo o repositório; para corrigir localmente: `pnpm format`.
      - run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O Prisma Client não vai para o Git (src/generated); o generate só lê o schema e não conecta no banco:
      # a variável precisa existir (prisma.config.ts exige), o banco não.
      - run: pnpm --filter api exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Confere os tipos (o Vitest e o ESLint não conferem): roda o `typecheck` de cada app/pacote.
      - run: pnpm turbo run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O Prisma Client não vai para o Git (src/generated); o generate só lê o schema e não conecta no banco:
      # a variável precisa existir (prisma.config.ts exige), o banco não.
      - run: pnpm --filter api exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Compila tudo como em produção: pega erro que só aparece no build (ex.: arquivo fora do rootDir).
      - run: pnpm turbo run build

  test:
    name: test
    # Os jobs rápidos vêm antes: se algum falhar, os pesados (test e codeql) nem rodam.
    needs: [lint, typecheck, build, commitlint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O Prisma Client não vai para o Git (src/generated) e os testes importam ele, então é gerado aqui.
      # O generate só lê o schema e não conecta no banco: a variável só precisa existir (prisma.config.ts exige).
      - run: pnpm --filter api exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # O threshold de 70% vive na config de cada app (Jest: coverageThreshold; Vitest: coverage.thresholds)
      - run: pnpm turbo run test -- --coverage

  codeql:
    name: codeql
    needs: [lint, typecheck, build, commitlint] # só roda se os jobs rápidos passarem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: dependency-review
    # Só em PR: compara as dependências do PR com a base e barra vulnerabilidade alta ou crítica.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  commitlint:
    name: commitlint
    # Roda sempre (os jobs pesados dependem dele), mas só confere algo em PR: no push para a main
    # os passos são pulados e o job passa direto. Confere o título do PR (vira a mensagem do commit
    # no squash) e as mensagens dos commits.
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico completo, para o commitlint enxergar todos os commits do PR
      - if: github.event_name == 'pull_request'
        uses: pnpm/action-setup@v6
      - if: github.event_name == 'pull_request'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: github.event_name == 'pull_request'
        run: pnpm install --frozen-lockfile
      - name: Título do PR
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }} # via variável de ambiente (não direto no comando), por segurança
        run: echo "$PR_TITLE" | pnpm exec commitlint --verbose
      - name: Commits do PR
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
